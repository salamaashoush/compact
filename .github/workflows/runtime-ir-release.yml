name: Runtime-IR fork release

# Builds compactc-binary (the runtime-ir-emitting fork) via nix on
# every Tier 1 target and uploads the result to a single GitHub
# release.  Triggered manually:
#   gh workflow run runtime-ir-release.yml -f tag=compactc-v0.31.101-runtime-ir.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. compactc-v0.31.101-runtime-ir.1)"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: true
        type: string
        default: feat/json-ir-emitter

permissions:
  contents: write

jobs:
  build:
    name: Build compactc-binary on ${{ matrix.target_triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_triple: x86_64-unknown-linux-musl
            asset: compactc-payload-x86_64-linux.tar.gz
            runner: ubuntu-latest
          - target_triple: aarch64-unknown-linux-musl
            asset: compactc-payload-aarch64-linux.tar.gz
            runner: ubuntu-24.04-arm
          - target_triple: aarch64-apple-darwin
            asset: compactc-payload-aarch64-macos.tar.gz
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            accept-flake-config = true

      - name: nix build compactc-binary
        run: |
          nix build .#compactc-binary -L

      - name: Inspect result
        run: |
          ls -lR result/
          file result/bin/* result/lib/* || true

      - name: Package as tarball
        env:
          TRIPLE: ${{ matrix.target_triple }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p "payload/$TRIPLE"
          cp result/bin/compactc       "payload/$TRIPLE/compactc"
          cp result/bin/compactc.bin   "payload/$TRIPLE/compactc.bin"
          cp result/bin/format-compact "payload/$TRIPLE/format-compact" 2>/dev/null || true
          cp result/bin/fixup-compact  "payload/$TRIPLE/fixup-compact" 2>/dev/null || true
          cp result/lib/zkir           "payload/$TRIPLE/zkir"
          cp result/lib/zkir-v3        "payload/$TRIPLE/zkir-v3"
          chmod +x "payload/$TRIPLE/"*
          tar -czf "$ASSET" -C payload "$TRIPLE"
          ls -lh "$ASSET"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create / update GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (for tag push)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          find artifacts/ -type f -name "*.tar.gz" -print -exec mv {} . \;
          ls -lh *.tar.gz

      - name: Create + push tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists locally"
          else
            git tag "$TAG"
            git push origin "$TAG" || echo "tag may already exist on remote — continuing"
          fi

      - name: Create release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          ASSETS=$(ls *.tar.gz)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $ASSETS \
              -R "$GITHUB_REPOSITORY" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $ASSETS \
              -R "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Compactc fork build (runtime-ir-emitting). Linux + macOS, x86_64 + aarch64."
          fi
